━━━ 제품 정보 ━━━
• 제품명: 전자계약 서비스 (SaaS, 클라우드 기반)
• 핵심 기능: 계약서 전자 서명·보관·검색·통합 관리 + 조직 내 AI 문서 관리 연동
• 가격 정책:
  - 계정 1개: 연 구독료 500만원
  - 계정 3개 이상: 10% 할인 (계정당 450만원)
  - 계정 5개 이상: 15% 할인 (계정당 425만원)

━━━ 셀링 포인트 ━━━
1. 서면 계약서의 관리·작성에 드는 시간과 비용을 클라우드 통합 관리로 대폭 절감

3. 수백 건의 계약서도 키워드 검색 하나로 즉시 조회
4. AI 연동: 조직 내 모든 계약서·문서를 AI가 분석·요약·검색 → 계약+문서 관리 원스톱
5. 분실·훼손 우려 없는 디지털 원본 증빙 보장

━━━ 고객 페인포인트 ━━━
1. 담당자가 바뀌면 옛날 계약서를 찾지 못해 난감한 상황 발생
2. 서면 계약서 분실로 인한 법적 증빙 불가 리스크
3. 이해관계자와 소통한 세부 사항을 서류 일일이 복기하는 시간 낭비
4. 수백 건의 문서·계약서 검색에 과도한 시간 소요

━━━ 세일즈 프로세스 & 목표 전환율 ━━━
리드 발굴 → 미팅 → 계약 → 리텐션/업셀링

• 미팅 → 계약: 목표 30%
• 계약 → 리텐션/업셀링: 목표 80%
각 전환율이 목표 미달 시, 현황을 분석하고 구체적인 개선 액션을 제안합니다.

━━━ 주요 레퍼런스 고객사 ━━━
삼성전자, SK하이닉스, 유한양행, 카카오, LG전자, LX하우시스, CJ대한통운

━━━ 거절 대응 방법 ━━━
1위 "가격이 비싸요" → 고객이 느끼는 핵심 문제점을 재확인하고, 그 문제를 해결하는 서비스 가치를 구체적 수치(시간 절감, 리스크 비용 등)로 전달. 레퍼런스 고객사 사례 활용.
2위 "조직에 적용하기 어려울 것 같아요" → 온보딩 프로세스와 지원 내용을 설명하고, 유사 규모·업종의 도입 레퍼런스 전달.
3위 "예산이 없습니다" → 1위와 동일하게 문제의 비용(현재 손실)과 솔루션 가치를 비교 제시. 분할 납부나 소규모 계정 도입 제안 검토.

아, 그런 문제가 있으셨군요. 지금 도입한 AI로는 좀 해소가 되고 있나요?
아, 만약 OOO님 클라우드 형태로 OOO님 계정으로 로그인만 하면 통합 관리가 되는 서비스가 활용되었을 때, 어떤 이점이 좀 상상되시나요?"

/* ──────────────────────────────────────────────
   API CALL
────────────────────────────────────────────── */
async function callClaude(apiKey, messages, onChunk) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key": apiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true",
    },
    body: JSON.stringify({
      model:"claude-haiku-4-5-20251001",
      max_tokens:1500,
      system: SYSTEM_PROMPT,
      messages,
    })
  });
  const d = await res.json();
  if (d.error) throw new Error(d.error.message);
  return d.content?.filter(b=>b.type==="text").map(b=>b.text).join("") || "";
}

/* API 키 설정 */
function ApiKeySetup({ apiKey, onSave }) {
  const [input, setInput] = useState("");
  const [show, setShow] = useState(!apiKey);

  if (!show && apiKey) return (
    <div style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"#888"}}>
      <span style={{width:7,height:7,borderRadius:"50%",background:"#1D9E75",display:"inline-block"}}/>
      API 키 설정됨
      <button style={{...s.btn("secondary"),padding:"3px 10px",fontSize:11}} onClick={()=>setShow(true)}>변경</button>
    </div>
  );

  return (
    <div style={{display:"flex",gap:8,alignItems:"center"}}>
      <span style={{width:7,height:7,borderRadius:"50%",background:"#ccc",display:"inline-block"}}/>
      <input
        style={{...s.input,padding:"6px 12px",fontSize:12,width:300}}
        type="password" placeholder="Anthropic API 키 (sk-ant-...)"
        value={input} onChange={e=>setInput(e.target.value)}
        onKeyDown={e=>e.key==="Enter"&&saveKey()}
      />
      <button style={{...s.btn("primary"),padding:"6px 16px",fontSize:12}} onClick={saveKey}>저장</button>
    </div>
  );

  function saveKey() {
    if (!input.startsWith("sk-ant-")) { alert("올바른 API 키를 입력해 주세요 (sk-ant- 로 시작)."); return; }
    localStorage.setItem("anthropic_api_key","sales-agent:"+input);
    onSave(input); setShow(false);
  }
}

/* 미팅 준비 탭 */
function MeetingPrepTab({ apiKey }) {
  const [company, setCompany] = useState("");
  const [contact, setContact] = useState("");

  const [industry, setIndustry] = useState("");
  const [extra, setExtra] = useState("");
  const [result, setResult] = useState("");

  const [mode, setMode] = useState("prep"); // prep | persona | agenda

  async function generate() {
    if (!apiKey) { alert("API 키를 먼저 설정해 주세요."); return; }
    if (!company) { alert("고객사명을 입력해 주세요."); return; }
    setLoading(true); setResult("");
    const modeText = {
      prep: `[${company}] 미팅 사전 준비 자료를 만들어주세요. 담당자: ${contact||"미입력"} / 직함: ${title||"미입력"} / 업종: ${industry||"미입력"}. 추가 정보: ${extra||"없음"}.\n포함 내용: ①기업 특성 요약 ②예상 페인포인트 ③우리 제품과의 연결 포인트 ④미팅 시 주의사항 ⑤추천 오프닝 멘트`,
      persona: `[${company}] ${contact||"담당자"}(${title||"직함 미상"})의 B2B 구매 페르소나를 분석해주세요. 업종: ${industry||"미입력"}. 추가 정보: ${extra||"없음"}.\n포함 내용: ①예상 KPI와 성과 지표 ②의사결정 방식 ③전자계약 SaaS 도입 시 관심 포인트 ④대화 시 활용할 가치 제안 문구`,
      agenda: `[${company}] 미팅 어젠다를 설계해주세요. 담당자: ${contact||"미입력"} / 직함: ${title||"미입력"} / 업종: ${industry||"미입력"}. 추가 정보: ${extra||"없음"}.\n포함 내용: 시간대별 어젠다(총 30~45분 기준), 각 세션의 목표, 반드시 확인할 질문 5가지, 미팅 마무리 멘트`
    };
    try {
      const text = await callClaude(apiKey, [{ role:"user", content: modeText[mode] }]);
      setResult(text);
    } catch(e) { setResult("오류: " + e.message); }
    setLoading(false);
  }

  return (
    <div>
      <div style={s.card}>
        <p style={s.sectionTitle}>고객사 정보 입력</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
          <div>
            <label style={{fontSize:12,color:"#888",display:"block",marginBottom:4}}>고객사명 *</label>
            <input style={s.input} placeholder="예: 삼성전자" value={company} onChange={e=>setCompany(e.target.value)}/>
          </div>
          <div>
            <label style={{fontSize:12,color:"#888",display:"block",marginBottom:4}}>업종</label>
            <input style={s.input} placeholder="예: 반도체, 제조, 금융..." value={industry} onChange={e=>setIndustry(e.target.value)}/>
          </div>
          <div>
            <label style={{fontSize:12,color:"#888",display:"block",marginBottom:4}}>담당자명</label>
            <input style={s.input} placeholder="예: 홍길동" value={contact} onChange={e=>setContact(e.target.value)}/>
          </div>
          <div>
            <label style={{fontSize:12,color:"#888",display:"block",marginBottom:4}}>직함/직급</label>
            <input style={s.input} placeholder="예: 법무팀 과장" value={title} onChange={e=>setTitle(e.target.value)}/>
          </div>
        </div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:12,color:"#888",display:"block",marginBottom:4}}>추가 정보 (알고 있는 것 자유 입력)</label>
          <textarea style={{...s.input,height:72}} placeholder="예: LinkedIn에서 확인한 정보, 최근 뉴스, 기존 계약서 관리 방식 등" value={extra} onChange={e=>setExtra(e.target.value)}/>
        </div>

        <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
          {[["prep","미팅 사전 준비"],["persona","고객 페르소나 분석"],["agenda","미팅 어젠다 설계"]].map(([id,label])=>(
            <button key={id} style={{...s.tab(mode===id),borderRadius:8}} onClick={()=>setMode(id)}>{label}</button>
          ))}
        </div>

        <button style={s.btn("primary")} onClick={generate} disabled={loading}>
          {loading ? "AI 분석 중..." : "AI 생성 ↗"}
        </button>
      </div>

      {(result||loading) && (
        <div style={s.card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={s.badge(C.purple)}>AI 결과</span>
            {result && <button style={{...s.btn("secondary"),padding:"4px 12px",fontSize:11}} onClick={()=>navigator.clipboard.writeText(result)}>복사</button>}
          </div>
          {loading ? <p style={{fontSize:13,color:"#888"}}>AI가 분석 중입니다...</p>
            : <div style={s.aiBox}>{result}</div>}
        </div>
      )}
    </div>
  );
}

    { id:"impl", label:"조직에 적용하기 어려울 것 같아요", rank:"2위", color:C.amber, tip:"온보딩 지원과 레퍼런스 고객사(삼성전자, SK하이닉스 등) 사례를 활용합니다." },

      custom: `고객이 "${customObj||"(직접 입력)"}"라고 거절했습니다. 고객사: ${company||"미입력"}. 전자계약 SaaS 세일즈 맥락에서 효과적인 대응 멘트를 제안해주세요.`,
    };
    try {
      const text = await callClaude(apiKey, [{ role:"user", content: q[objId] }]);
      setResult(text);
    } catch(e) { setResult("오류: " + e.message); }

/* AI 채팅 탭 */
function ChatTab({ apiKey }) {
  const [messages, setMessages] = useState([
    { role:"assistant", content:"안녕하세요! 전자계약 SaaS 세일즈 AI 에이전트입니다.\n미팅 준비, 콜드콜 스크립트, 반대 처리, 팔로우업 등 세일즈 전 과정을 도와드립니다. 무엇이든 물어보세요 😊" }
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const bottomRef = useRef(null);

  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior:"smooth" }); }, [messages]);

  async function send() {
    if (!input.trim() || loading) return;
    if (!apiKey) { alert("API 키를 먼저 설정해 주세요."); return; }
    const userMsg = { role:"user", content: input.trim() };
    const newMsgs = [...messages, userMsg];
    setMessages(newMsgs); setInput(""); setLoading(true);
    try {
      const history = newMsgs.filter(m=>m.role!=="assistant"||newMsgs.indexOf(m)>0).map(m=>({ role:m.role, content:m.content }));
      const text = await callClaude(apiKey, history);
      setMessages(prev=>[...prev, { role:"assistant", content:text }]);
    } catch(e) {
      setMessages(prev=>[...prev, { role:"assistant", content:"오류: " + e.message }]);
    }
    setLoading(false);
  }

  const QUICK = ["미팅 준비 체크리스트 알려줘","콜드콜 핵심 팁 3가지","가격 거절 시 대응 멘트","계약 이후 업셀링 전략"];

  return (
    <div>
      <div style={{...s.card,height:420,overflowY:"auto",display:"flex",flexDirection:"column",gap:0}}>
        {messages.map((m,i)=>(
          <div key={i} style={s.chatBubble(m.role)}>
            {m.role==="assistant"&&<span style={{fontSize:11,color:"#aaa",marginBottom:4}}>AI 에이전트</span>}
            <div style={s.bubble(m.role)}>{m.content}</div>
          </div>
        ))}
        {loading && (
          <div style={s.chatBubble("assistant")}>
            <span style={{fontSize:11,color:"#aaa",marginBottom:4}}>AI 에이전트</span>
            <div style={{...s.bubble("assistant"),color:"#aaa"}}>답변 작성 중...</div>
          </div>
        )}
        <div ref={bottomRef}/>
      </div>

      <div style={{display:"flex",flexWrap:"wrap",gap:6,margin:"10px 0 8px"}}>
        {QUICK.map(q=>(
          <button key={q} style={s.pill} onClick={()=>{ setInput(q); }}>
            {q}
          </button>
        ))}
      </div>

      <div style={{display:"flex",gap:8}}>
        <input
          style={{...s.input,flex:1}}
          placeholder="세일즈 관련 무엇이든 물어보세요..."
          value={input}
          onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&(e.preventDefault(),send())}
        />
        <button style={{...s.btn("primary"),whiteSpace:"nowrap"}} onClick={send} disabled={loading}>전송</button>
      </div>
    </div>
  );
}
